<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyOS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050b05;
            color: #00ff66;
            font-family: 'VT323', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Scanline and Vignette Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
            z-index: 40;
            pointer-events: none;
        }

        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.7), 0.0 0 20px rgba(0, 255, 102, 0.3);
        }

        /* Custom scrollbar for terminal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020502;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff66;
            border-radius: 4px;
        }

        .blink {
            animation: blinker 1s cubic-bezier(0.5, 0, 1, 1) infinite;
        }

        @keyframes blinker {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="crt">

    <div id="terminal-wrapper" class="w-full h-full md:w-[900px] md:h-[600px] bg-black border-4 border-[#00ff66]/40 rounded-xl shadow-[0_0_50px_rgba(0,255,102,0.15)] flex flex-col p-6 relative z-10 box-border">
        
        <!-- Terminal Top Bar -->
        <div class="flex justify-between items-center border-b border-[#00ff66]/30 pb-3 mb-4 text-xl tracking-widest uppercase select-none">
            <div class="flex items-center space-x-2">
                <span class="inline-block w-3 h-3 bg-[#00ff66] rounded-full animate-pulse"></span>
                <span class="glow-text">GalaxyOS Kernel v4.0.2</span>
            </div>
            <div class="text-sm text-[#00ff66]/60 font-mono">SECURE_TERMINAL_SESSION</div>
        </div>

        <!-- Terminal Main Scrollable Area -->
        <div id="output" class="flex-1 overflow-y-auto space-y-2 text-2xl pr-2 leading-relaxed flex flex-col justify-end">
            <!-- Dynamic content injected via JavaScript -->
        </div>

        <!-- Interactive Input Line -->
        <div id="input-container" class="hidden items-center mt-4 pt-3 border-t border-[#00ff66]/20 text-2xl">
            <span id="prompt-symbol" class="glow-text mr-2">&gt;</span>
            <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" autofocus
                   class="bg-transparent border-none outline-none text-[#00ff66] font-mono flex-1 glow-text text-2xl caret-[#00ff66]">
            <span class="blink bg-[#00ff66] w-3 h-6 inline-block ml-1"></span>
        </div>

    </div>

    <script>
        // Web Audio API Sound Synthesizer for authentic terminal sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playKeySound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300 + Math.random() * 150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                // Ignore audio restriction errors prior to interaction
            }
        }

        function playBeep(freq = 440, duration = 0.1) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Terminal state variables
        const output = document.getElementById('output');
        const inputContainer = document.getElementById('input-container');
        const terminalInput = document.getElementById('terminal-input');
        
        let currentState = 'booting';

        // Helper to append lines to the terminal
        function printLine(text, className = '') {
            const div = document.createElement('div');
            div.className = className + ' glow-text';
            div.textContent = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        // Helper for custom HTML elements (like loading bars)
        function appendElement(element) {
            output.appendChild(element);
            output.scrollTop = output.scrollHeight;
        }

        async function startBootSequence() {
            printLine("INITIALIZING GALAXY_OS KERNEL MODULES...");
            await sleep(400);
            printLine("MOUNTING VIRTUAL FILESYSTEM... [OK]");
            await sleep(400);
            printLine("CONNECTING TO QUANTUM NEURAL MESH... [OK]");
            await sleep(600);
            
            printLine("\nLAUNCHING GALAXYOS:");
            
            // Create loading bar element
            const barContainer = document.createElement('div');
            barContainer.className = "font-mono text-xl my-2 text-[#00ff66]";
            barContainer.innerHTML = `[<span id="boot-bar"></span>] <span id="boot-percent">0%</span>`;
            appendElement(barContainer);

            const barSpan = document.getElementById('boot-bar');
            const percentSpan = document.getElementById('boot-percent');
            
            let progress = 0;
            const totalSteps = 20;
            const intervalTime = 120; // ~2.4 seconds total for boot bar

            const bootTimer = setInterval(() => {
                progress++;
                const hashes = '#'.repeat(progress);
                const spaces = '-'.repeat(totalSteps - progress);
                barSpan.textContent = hashes + spaces;
                const percent = Math.floor((progress / totalSteps) * 100);
                percentSpan.textContent = percent + '%';
                playKeySound();

                if (progress >= totalSteps) {
                    clearInterval(bootTimer);
                    playBeep(880, 0.2);
                    setTimeout(promptUpdate, 600);
                }
            }, intervalTime);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function promptUpdate() {
            printLine("\nSYSTEM ALERT: New OS update available.");
            printLine("Do you want to update? (yes/no)");
            
            inputContainer.classList.remove('hidden');
            inputContainer.classList.add('flex');
            terminalInput.focus();
            currentState = 'waiting_for_decision';
        }

        // Handle typing sound effects and enter key presses
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleUserSubmit();
            } else {
                playKeySound();
            }
        });

        // Ensure clicking anywhere focuses input
        document.addEventListener('click', () => {
            if (currentState === 'waiting_for_decision') {
                terminalInput.focus();
            }
        });

        function handleUserSubmit() {
            if (currentState !== 'waiting_for_decision') return;

            const val = terminalInput.value.trim().toLowerCase();
            if (val !== 'yes' && val !== 'no') {
                printLine(`> ${terminalInput.value}`);
                printLine("INVALID INPUT. Please type 'yes' or 'no'.", "text-red-400");
                terminalInput.value = '';
                return;
            }

            // Lock input
            printLine(`> ${val}`);
            terminalInput.value = '';
            inputContainer.classList.remove('flex');
            inputContainer.classList.add('hidden');
            currentState = 'processing';

            if (val === 'yes') {
                runNovaUpdateSequence();
            } else {
                runOldGalaxySequence();
            }
        }

        async function runNovaUpdateSequence() {
            printLine("\nINITIATING NOVA OS PROTOCOL...");
            printLine("Downloading system packages & quantum patches...");
            await sleep(800);

            // 10-second loading bar (e.g. 40 steps @ 250ms = 10,000ms)
            const barContainer = document.createElement('div');
            barContainer.className = "font-mono text-xl my-2 text-[#00ff66]";
            barContainer.innerHTML = `[<span id="nova-bar"></span>] <span id="nova-percent">0%</span>`;
            appendElement(barContainer);

            const barSpan = document.getElementById('nova-bar');
            const percentSpan = document.getElementById('nova-percent');

            let progress = 0;
            const totalSteps = 30;
            const stepDuration = 333; // ~10 seconds total

            const novaTimer = setInterval(() => {
                progress++;
                const hashes = '#'.repeat(progress);
                const spaces = '-'.repeat(totalSteps - progress);
                barSpan.textContent = hashes + spaces;
                const percent = Math.floor((progress / totalSteps) * 100);
                percentSpan.textContent = percent + '%';
                
                if (progress % 3 === 0) playKeySound();

                if (progress >= totalSteps) {
                    clearInterval(novaTimer);
                    playBeep(920, 0.4);
                    printLine("\nUPDATE SUCCESSFUL! Redirecting to Nova Environment...");
                    setTimeout(() => {
                        window.location.href = 'https://atlasos-official.github.io/Nova';
                    }, 1200);
                }
            }, stepDuration);
        }

        async function runOldGalaxySequence() {
            printLine("\nROUTING TO LEGACY GALAXY ARCHIVE...");
            
            // 3-second loading bar displaying 'Loading...'
            const barContainer = document.createElement('div');
            barContainer.className = "font-mono text-xl my-2 text-[#00ff66]";
            barContainer.innerHTML = `Loading... [<span id="old-bar"></span>] <span id="old-percent">0%</span>`;
            appendElement(barContainer);

            const barSpan = document.getElementById('old-bar');
            const percentSpan = document.getElementById('old-percent');

            let progress = 0;
            const totalSteps = 15;
            const stepDuration = 200; // ~3 seconds total (15 * 200ms = 3000ms)

            const oldTimer = setInterval(() => {
                progress++;
                const hashes = '#'.repeat(progress);
                const spaces = '-'.repeat(totalSteps - progress);
                barSpan.textContent = hashes + spaces;
                const percent = Math.floor((progress / totalSteps) * 100);
                percentSpan.textContent = percent + '%';
                
                playKeySound();

                if (progress >= totalSteps) {
                    clearInterval(oldTimer);
                    playBeep(520, 0.3);
                    printLine("\nLEGACY KERNEL LOADED. Redirecting...");
                    setTimeout(() => {
                        window.location.href = 'https://atlasos-official.github.io/Galaxy/old';
                    }, 1000);
                }
            }, stepDuration);
        }

        // Initialize terminal on window load
        window.onload = function() {
            // Enable audio context on first interaction anywhere
            window.addEventListener('click', () => {
                initAudio();
            }, { once: true });

            startBootSequence();
        };
    </script>
</body>
</html>
