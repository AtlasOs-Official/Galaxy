<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy OS Live Session</title>
  <style>
    :root {
      --galaxy-accent: #9d4edd;
      --galaxy-glow: #7b2cbf;
      --mint-dark: #1a1829;
      --mint-light-dark: #242038;
      --mint-panel: #121020;
      --text-color: #e0aaff;
      --text-main: #f8f7ff;
      --border-color: #3c096c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Ubuntu', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #240046 0%, #10002b 60%, #03001e 100%);
      color: var(--text-main);
    }

    /* Helper class to hide uninstalled apps */
    .installed-app {
      display: none !important;
    }

    /* Main OS Layout */
    #desktop {
      height: calc(100vh - 40px);
      width: 100vw;
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 15px;
    }

    .shortcut {
      width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .shortcut:hover {
      background: rgba(157, 78, 221, 0.25);
    }

    .shortcut-icon {
      font-size: 32px;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 5px rgba(157, 78, 221, 0.6));
    }

    .shortcut-label {
      font-size: 12px;
      color: var(--text-main);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }

    /* Bottom Panel */
    #panel {
      height: 40px;
      width: 100vw;
      background-color: var(--mint-panel);
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      z-index: 9999;
    }

    .panel-left, .panel-right {
      display: flex;
      align-items: center;
      height: 100%;
    }

    #start-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-weight: bold;
      cursor: pointer;
    }

    #start-btn:hover {
      background-color: rgba(157, 78, 221, 0.2);
    }

    /* Enhanced Planet Vector Start Logo */
    .galaxy-logo-svg {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 0 6px #c77dff);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    #start-btn:hover .galaxy-logo-svg {
      transform: scale(1.15) rotate(10deg);
      filter: drop-shadow(0 0 10px #ff9e00);
    }

    #tasks-container {
      display: flex;
      gap: 4px;
      height: 100%;
      align-items: center;
    }

    .task-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 32px;
      background-color: var(--mint-light-dark);
      border-bottom: 2px solid var(--galaxy-accent);
      border-radius: 4px 4px 0 0;
      font-size: 12px;
      max-width: 150px;
      cursor: pointer;
      color: var(--text-main);
    }

    .tray-clock {
      padding: 0 15px;
      font-size: 13px;
      color: var(--text-color);
    }

    /* Start Menu */
    #start-menu {
      position: fixed;
      bottom: 40px;
      left: 0;
      width: 320px;
      height: 360px;
      background-color: var(--mint-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 0 8px 0 0;
      display: none;
      flex-direction: column;
      z-index: 9998;
    }

    .menu-header {
      padding: 12px;
      background: var(--mint-panel);
      border-bottom: 1px solid var(--border-color);
    }

    .menu-header input {
      width: 100%;
      padding: 8px 12px;
      background: var(--mint-light-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      outline: none;
    }

    .menu-items {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
    }

    .menu-item:hover {
      background-color: var(--galaxy-accent);
      color: #fff;
    }

    /* Window Elements */
    .window {
      position: absolute;
      top: 80px;
      left: 150px;
      width: 580px;
      height: 420px;
      background-color: var(--mint-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px 8px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      z-index: 10;
    }

    .window.resizing-or-maximizing {
      transition: top 0.15s ease, left 0.15s ease, width 0.15s ease, height 0.15s ease;
    }

    .window.is-dragging {
      will-change: top, left;
    }

    .window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 40px) !important;
      border-radius: 0 !important;
    }

    .window-header {
      height: 34px;
      background-color: var(--mint-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-radius: 7px 7px 0 0;
      cursor: move;
      border-bottom: 1px solid var(--border-color);
    }

    .window.maximized .window-header {
      border-radius: 0;
      cursor: default;
    }

    .window-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-color);
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #000;
    }

    .win-close { background-color: #ff5f56; }
    .win-max { background-color: #27c93f; }

    .window-body {
      flex-grow: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* App Styles */
    .installer-window {
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }

    .installer-btn {
      margin-top: 20px;
      background: var(--galaxy-accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .installer-btn:hover {
      background: var(--galaxy-glow);
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: var(--mint-panel);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 20px;
      display: none;
      border: 1px solid var(--border-color);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7b2cbf, #ff9e00);
      transition: width 0.1s linear;
    }

    .terminal-body {
      background-color: #0c0a14;
      color: #d8b4fe;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      padding: 15px;
      height: 100%;
    }

    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--mint-panel);
      border-bottom: 1px solid var(--border-color);
    }

    .browser-bar input {
      flex-grow: 1;
      padding: 6px 12px;
      background: var(--mint-light-dark);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .window.is-dragging .browser-frame {
      pointer-events: none;
    }

    .terminal-input-line {
      display: flex;
      gap: 8px;
    }

    .terminal-input {
      background: transparent;
      border: none;
      color: #d8b4fe;
      font-family: inherit;
      font-size: inherit;
      flex-grow: 1;
      outline: none;
    }

    /* Square App Store Grid */
    .appstore-container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 170px));
      gap: 20px;
      overflow-y: auto;
      height: 100%;
      justify-content: center;
    }

    .app-card {
      width: 170px;
      height: 170px;
      background: var(--mint-light-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }

    .app-card-icon {
      font-size: 34px;
      margin-top: 4px;
    }

    .app-card-title {
      font-weight: bold;
      color: var(--text-main);
      font-size: 14px;
    }

    .app-card-desc {
      font-size: 11px;
      color: var(--text-color);
      line-height: 1.2;
    }

    .app-card-btn {
      background: var(--galaxy-accent);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      width: 100%;
    }

    .app-card-btn:disabled {
      background: #3c3452;
      cursor: default;
    }

    .app-card-progress-container {
      width: 100%;
      height: 8px;
      background: var(--mint-panel);
      border-radius: 4px;
      overflow: hidden;
      display: none;
      border: 1px solid var(--border-color);
    }

    .app-card-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7b2cbf, #ff9e00);
      transition: width 0.1s linear;
    }

    /* File Runner UI */
    .file-runner-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 10px;
      background: #0d0a18;
      position: relative;
    }

    .file-runner-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .file-runner-controls select, 
    .file-runner-controls button, 
    .file-runner-btn-upload {
      background: var(--mint-light-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 12px;
    }

    .file-runner-btn-upload {
      background: #3c096c;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .file-runner-btn-upload:hover {
      background: var(--galaxy-accent);
    }

    .file-runner-controls button.run-btn {
      background: var(--galaxy-accent);
      cursor: pointer;
      font-weight: bold;
    }

    .file-runner-controls button.fullscreen-btn {
      background: #242038;
      cursor: pointer;
      margin-left: auto;
    }

    .file-runner-controls button.fullscreen-btn:hover {
      background: #3c096c;
    }

    .file-runner-editor {
      flex-grow: 1;
      width: 100%;
      background: #141024;
      border: 1px solid var(--border-color);
      color: #e0aaff;
      font-family: 'Consolas', monospace;
      padding: 10px;
      border-radius: 4px;
      outline: none;
      resize: none;
    }

    .file-runner-preview-wrapper {
      position: relative;
      height: 180px;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .file-runner-preview {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-runner-preview img,
    .file-runner-preview video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .file-runner-preview audio {
      width: 80%;
    }

    /* Fullscreen mode inside the app window */
    .file-runner-container.fullscreen-preview .file-runner-controls,
    .file-runner-container.fullscreen-preview .file-runner-editor {
      display: none !important;
    }

    .file-runner-container.fullscreen-preview .file-runner-preview-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      z-index: 100;
    }

    .exit-fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(20, 16, 36, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      z-index: 101;
      display: none;
      backdrop-filter: blur(4px);
    }

    .exit-fullscreen-btn:hover {
      background: var(--galaxy-accent);
    }

    .file-runner-container.fullscreen-preview .exit-fullscreen-btn {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Desktop Icons -->
  <div id="desktop">
    <div class="shortcut" id="installer-shortcut" onclick="openInstaller()">
      <div class="shortcut-icon">💿</div>
      <div class="shortcut-label">Install Galaxy OS</div>
    </div>
    <div class="shortcut installed-app" onclick="openTerminal()">
      <div class="shortcut-icon">💻</div>
      <div class="shortcut-label">Terminal</div>
    </div>
    <div class="shortcut installed-app" onclick="openBrowser()">
      <div class="shortcut-icon">🌐</div>
      <div class="shortcut-label">Browser</div>
    </div>
    <div class="shortcut installed-app" onclick="openAppStore()">
      <div class="shortcut-icon">🛍️</div>
      <div class="shortcut-label">App Store</div>
    </div>
    <div class="shortcut installed-app file-runner-app" onclick="openFileRunner()">
      <div class="shortcut-icon">⚙️</div>
      <div class="shortcut-label">File Runner</div>
    </div>
    <div class="shortcut installed-app realchat-app" onclick="openRealChat()">
      <div class="shortcut-icon">💬</div>
      <div class="shortcut-label">RealChat</div>
    </div>
    <div class="shortcut installed-app yt2-app" onclick="openYt2()">
      <div class="shortcut-icon">📺</div>
      <div class="shortcut-label">YT 2</div>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div class="menu-header">
      <input type="text" placeholder="Search Galaxy OS...">
    </div>
    <div class="menu-items">
      <div class="menu-item" id="installer-menu-item" onclick="openInstaller(); toggleStartMenu();">
        <span>💿</span> Install Galaxy OS
      </div>
      <div class="menu-item installed-app" onclick="openTerminal(); toggleStartMenu();">
        <span>💻</span> Terminal
      </div>
      <div class="menu-item installed-app" onclick="openBrowser(); toggleStartMenu();">
        <span>🌐</span> Browser
      </div>
      <div class="menu-item installed-app" onclick="openAppStore(); toggleStartMenu();">
        <span>🛍️</span> App Store
      </div>
      <div class="menu-item installed-app file-runner-app" onclick="openFileRunner(); toggleStartMenu();">
        <span>⚙️</span> File Runner
      </div>
      <div class="menu-item installed-app realchat-app" onclick="openRealChat(); toggleStartMenu();">
        <span>💬</span> RealChat
      </div>
      <div class="menu-item installed-app yt2-app" onclick="openYt2(); toggleStartMenu();">
        <span>📺</span> YT 2
      </div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div id="panel">
    <div class="panel-left">
      <button id="start-btn" onclick="toggleStartMenu()">
        <!-- Galaxy Logo SVG -->
        <svg class="galaxy-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="30" fill="url(#planetGradient)"/>
          <ellipse cx="50" cy="50" rx="46" ry="14" stroke="url(#ringGradient)" stroke-width="6" transform="rotate(-25 50 50)"/>
          <defs>
            <linearGradient id="planetGradient" x1="20" y1="20" x2="80" y2="80">
              <stop offset="0%" stop-color="#ff9e00" />
              <stop offset="50%" stop-color="#c77dff" />
              <stop offset="100%" stop-color="#3c096c" />
            </linearGradient>
            <linearGradient id="ringGradient" x1="0" y1="0" x2="100" y2="0">
              <stop offset="0%" stop-color="#e0aaff" stop-opacity="0.3" />
              <stop offset="50%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.3" />
            </linearGradient>
          </defs>
        </svg>
        <span>Galaxy OS</span>
      </button>
      <div id="tasks-container"></div>
    </div>
    <div class="panel-right">
      <div class="tray-clock" id="clock">12:00 PM</div>
    </div>
  </div>

  <script>
    let zIndexCounter = 100;
    let installerWin = null;
    let isFileRunnerInstalled = false;
    let isRealChatInstalled = false;
    let isYt2Installed = false;

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Start Menu Toggle
    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('start-menu');
      const startBtn = document.getElementById('start-btn');
      if (!menu.contains(e.target) && !startBtn.contains(e.target)) {
        menu.style.display = 'none';
      }
    });

    // Window Creation Logic
    function createWindow(title, content, customClass = '') {
      const win = document.createElement('div');
      win.className = 'window';
      win.style.zIndex = ++zIndexCounter;

      win.style.top = (80 + (document.querySelectorAll('.window').length * 20)) + 'px';
      win.style.left = (100 + (document.querySelectorAll('.window').length * 20)) + 'px';

      win.innerHTML = `
        <div class="window-header">
          <span class="window-title">${title}</span>
          <div class="window-controls">
            <button class="win-btn win-max" onclick="toggleMaximize(this)" title="Maximize/Restore">+</button>
            <button class="win-btn win-close" onclick="closeWindow(this)" title="Close">×</button>
          </div>
        </div>
        <div class="window-body ${customClass}">${content}</div>
      `;

      document.body.appendChild(win);
      makeDraggable(win);
      win.addEventListener('mousedown', () => win.style.zIndex = ++zIndexCounter);
      
      addTaskbarItem(title, win);
      return win;
    }

    function closeWindow(btn) {
      const win = btn.closest('.window');
      win.remove();
    }

    // Toggle Window Fullscreen/Maximize
    function toggleMaximize(btn) {
      const win = btn.closest('.window');
      
      win.classList.add('resizing-or-maximizing');
      
      if (!win.classList.contains('maximized')) {
        win.dataset.prevTop = win.style.top;
        win.dataset.prevLeft = win.style.left;
        win.dataset.prevWidth = win.style.width;
        win.dataset.prevHeight = win.style.height;

        win.classList.add('maximized');
        btn.innerText = '❐';
      } else {
        win.classList.remove('maximized');
        win.style.top = win.dataset.prevTop || '80px';
        win.style.left = win.dataset.prevLeft || '150px';
        win.style.width = win.dataset.prevWidth || '580px';
        win.style.height = win.dataset.prevHeight || '420px';
        btn.innerText = '+';
      }

      setTimeout(() => win.classList.remove('resizing-or-maximizing'), 150);
    }

    // Progress Loader Function supporting custom durations
    function runTimedProgress(barElement, durationMs, statusCallback, completeCallback) {
      const intervalMs = 100;
      let elapsedTime = 0;

      const interval = setInterval(() => {
        elapsedTime += intervalMs;
        const progress = Math.min((elapsedTime / durationMs) * 100, 100);
        barElement.style.width = progress + '%';

        if (statusCallback) statusCallback(progress);

        if (elapsedTime >= durationMs) {
          clearInterval(interval);
          if (completeCallback) completeCallback();
        }
      }, intervalMs);
    }

    // App: Galaxy OS Installer App (30s progress)
    function openInstaller() {
      if (document.getElementById('installer-window-el')) return;

      const installerHTML = `
        <div class="installer-window" id="installer-window-el">
          <h2>Install Galaxy OS 1.0</h2>
          <p style="margin-top: 10px; color: var(--text-color);">Welcome! Click below to begin installing Galaxy OS.</p>
          <button class="installer-btn" id="install-btn" onclick="runInstallationProcess(this)">Install Now</button>
          <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p id="install-status" style="margin-top: 12px; font-size: 13px; color: var(--text-color);"></p>
        </div>
      `;
      installerWin = createWindow('Install Galaxy OS', installerHTML);
    }

    function runInstallationProcess(btn) {
      btn.style.display = 'none';
      const container = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('install-status');

      container.style.display = 'block';

      // 30 Seconds = 30,000 ms
      runTimedProgress(
        progressBar,
        30000,
        (progress) => {
          if (progress < 20) statusText.innerText = "Initializing system disk partition...";
          else if (progress < 45) statusText.innerText = "Extracting Galaxy OS core packages...";
          else if (progress < 70) statusText.innerText = "Installing core system dependencies...";
          else if (progress < 90) statusText.innerText = "Configuring user workspace settings...";
          else if (progress < 100) statusText.innerText = "Finalizing installation...";
          else statusText.innerText = "Installation complete!";
        },
        () => {
          setTimeout(() => {
            document.getElementById('installer-shortcut')?.remove();
            document.getElementById('installer-menu-item')?.remove();
            
            document.querySelectorAll('.installed-app:not(.file-runner-app):not(.realchat-app):not(.yt2-app)').forEach(app => {
              app.classList.remove('installed-app');
            });
            
            if (installerWin) installerWin.remove();
            alert("Galaxy OS has been successfully installed!");
          }, 300);
        }
      );
    }

    // App: File Runner (.html, .bat, Audio, Video, & Picture Executor)
    function openFileRunner() {
      const runnerHTML = `
        <div class="file-runner-container">
          <div class="file-runner-controls">
            <label style="font-size: 12px;">Type:</label>
            <select id="file-type-select" onchange="updateDefaultScriptTemplate(this)">
              <option value="html">HTML File (.html)</option>
              <option value="bat">Batch Script (.bat)</option>
              <option value="image">Image (.png, .jpg, .gif, .svg)</option>
              <option value="audio">Audio (.mp3, .wav, .ogg)</option>
              <option value="video">Video (.mp4, .webm, .ogg)</option>
            </select>
            
            <label class="file-runner-btn-upload">
              📁 Upload File
              <input type="file" accept=".html,.htm,.bat,.png,.jpg,.jpeg,.gif,.svg,.webp,.mp3,.wav,.ogg,.mp4,.webm" style="display: none;" onchange="handleFileUpload(this)">
            </label>

            <button class="run-btn" onclick="executeRunnerScript(this)">Run / Preview File</button>
            <button class="fullscreen-btn" onclick="togglePreviewFullscreen(this)">⛶ Fullscreen Preview</button>
          </div>
          <textarea class="file-runner-editor" id="file-code-input" placeholder="Enter file code, direct media URL, or upload a file above..."><h1 style="color: #9d4edd; font-family: sans-serif;">Hello from Galaxy OS!</h1>\n<p style="color: #fff;">HTML file successfully rendered.</p></textarea>
          <div class="file-runner-preview-wrapper">
            <button class="exit-fullscreen-btn" onclick="togglePreviewFullscreen(this)">✕ Exit Fullscreen</button>
            <div class="file-runner-preview" id="file-runner-output"></div>
          </div>
        </div>
      `;
      createWindow('File Runner', runnerHTML);
    }

    function togglePreviewFullscreen(btn) {
      const container = btn.closest('.file-runner-container');
      container.classList.toggle('fullscreen-preview');
    }

    function handleFileUpload(input) {
      const file = input.files[0];
      if (!file) return;

      const container = input.closest('.file-runner-container');
      const select = container.querySelector('#file-type-select');
      const editor = container.querySelector('#file-code-input');

      const fileName = file.name.toLowerCase();
      
      // Automatic extension detection
      if (fileName.endsWith('.bat')) {
        select.value = 'bat';
      } else if (fileName.endsWith('.html') || fileName.endsWith('.htm')) {
        select.value = 'html';
      } else if (/\.(png|jpe?g|gif|svg|webp)$/i.test(fileName)) {
        select.value = 'image';
      } else if (/\.(mp3|wav|ogg)$/i.test(fileName)) {
        select.value = 'audio';
      } else if (/\.(mp4|webm)$/i.test(fileName)) {
        select.value = 'video';
      }

      const reader = new FileReader();

      // Read text vs media objects
      if (select.value === 'html' || select.value === 'bat') {
        reader.onload = function(e) {
          editor.value = e.target.result;
          executeRunnerScript(input);
        };
        reader.readAsText(file);
      } else {
        reader.onload = function(e) {
          editor.value = e.target.result; // Data URL for media
          executeRunnerScript(input);
        };
        reader.readAsDataURL(file);
      }
    }

    function updateDefaultScriptTemplate(select) {
      const editor = select.closest('.file-runner-container').querySelector('#file-code-input');
      const type = select.value;

      if (type === 'html') {
        editor.value = `<h1 style="color: #9d4edd; font-family: sans-serif;">Hello from Galaxy OS!</h1>\n<p style="color: #fff;">HTML file successfully rendered.</p>`;
      } else if (type === 'bat') {
        editor.value = `@echo off\necho Initializing Galaxy OS Batch Runner...\necho System check: OK\necho Process complete!`;
      } else if (type === 'image') {
        editor.value = `https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80`;
      } else if (type === 'audio') {
        editor.value = `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3`;
      } else if (type === 'video') {
        editor.value = `https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4`;
      }
    }

    function executeRunnerScript(btn) {
      const container = btn.closest('.file-runner-container');
      const type = container.querySelector('#file-type-select').value;
      const content = container.querySelector('#file-code-input').value.trim();
      const output = container.querySelector('#file-runner-output');

      output.innerHTML = '';

      if (type === 'html') {
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.background = '#ffffff';
        output.appendChild(iframe);
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write(content);
        iframe.contentWindow.document.close();
      } else if (type === 'bat') {
        const consoleDiv = document.createElement('div');
        consoleDiv.style.padding = '12px';
        consoleDiv.style.color = '#00ff66';
        consoleDiv.style.fontFamily = 'monospace';
        consoleDiv.style.fontSize = '13px';
        consoleDiv.style.whiteSpace = 'pre-wrap';
        consoleDiv.style.width = '100%';

        const lines = content.split('\n');
        let outputText = '';
        lines.forEach(line => {
          let trimmed = line.trim();
          if (trimmed.startsWith('echo ')) {
            outputText += trimmed.substring(5) + '\n';
          } else if (trimmed !== '@echo off' && trimmed !== '') {
            outputText += `>'${trimmed}' is executed.\n`;
          }
        });

        consoleDiv.innerText = outputText || 'Batch execution completed with no output.';
        output.appendChild(consoleDiv);
      } else if (type === 'image') {
        const img = document.createElement('img');
        img.src = content;
        img.alt = 'Image Preview';
        output.appendChild(img);
      } else if (type === 'audio') {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.autoplay = true;
        audio.src = content;
        output.appendChild(audio);
      } else if (type === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.src = content;
        output.appendChild(video);
      }
    }

    // App: Terminal
    function openTerminal() {
      const terminalHTML = `

        <div id="term-output"></div>
        <div class="terminal-input-line">

        </div>
      `;
      createWindow('Terminal', terminalHTML, 'terminal-body');
    }

    function handleTerminal(e, input) {
      if (e.key === 'Enter') {
        const command = input.value.trim();
        const output = input.parentElement.previousElementSibling;
        
        let response = '';
        if (command === 'help') {
          response = 'Available commands: help, clear, whoami, date';
        } else if (command === 'clear') {
          output.innerHTML = '';
          input.value = '';
          return;
        } else if (command === 'whoami') {
          response = 'galaxy-user';
        } else if (command === 'date') {
          response = new Date().toString();
        } else if (command !== '') {
          response = `command not found: ${command}`;
        }

        output.innerHTML += `<div>user@galaxy-os:~$ ${command}</div>`;
        if (response) {
          output.innerHTML += `<div>${response}</div>`;
        }
        
        input.value = '';
        input.scrollIntoView();
      }
    }

    // Taskbar Tabs
    function addTaskbarItem(title, winElement) {
      const container = document.getElementById('tasks-container');
      const tab = document.createElement('div');
      tab.className = 'task-tab';
      tab.innerText = title;
      tab.onclick = () => winElement.style.zIndex = ++zIndexCounter;
      container.appendChild(tab);

      const observer = new MutationObserver(() => {
        if (!document.body.contains(winElement)) {
          tab.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });
    }

    // High-Performance Window Dragging
    function makeDraggable(elmnt) {
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      let isDragging = false;
      let animationFrameId = null;

      const header = elmnt.querySelector('.window-header');

      header.onmousedown = (e) => {
        if (elmnt.classList.contains('maximized') || e.target.classList.contains('win-btn')) return;

        e.preventDefault();

        startX = e.clientX;
        startY = e.clientY;
        initialLeft = elmnt.offsetLeft;
        initialTop = elmnt.offsetTop;
        isDragging = true;

        elmnt.classList.add('is-dragging');

        document.onmousemove = onMouseMove;
        document.onmouseup = stopDragging;
      };

      function onMouseMove(e) {
        if (!isDragging) return;

        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        animationFrameId = requestAnimationFrame(() => {
          elmnt.style.left = `${initialLeft + deltaX}px`;
          elmnt.style.top = `${initialTop + deltaY}px`;
        });
      }

      function stopDragging() {
        isDragging = false;
        elmnt.classList.remove('is-dragging');
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        document.onmousemove = null;
        document.onmouseup = null;
      }
    }
  </script>
